<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pwani Pure</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
font-family:'Poppins', sans-serif;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 7%;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(12px);
z-index:1000;
border-bottom:1px solid rgba(255,215,0,0.2);
}

.logo{
font-size:34px;
font-family:'Cinzel', serif;
color:gold;
font-weight:bold;
}

.nav-links{
display:flex;
gap:30px;
align-items:center;
}

.nav-links a{
color:white;
text-decoration:none;
transition:0.3s;
}

.nav-links a:hover{
color:gold;
}

.cart{
background:gold;
color:black !important;
padding:10px 20px;
border-radius:30px;
font-weight:600;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:0 8%;

background:
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
url('https://images.pexels.com/photos/6621461/pexels-photo-6621461.jpeg');

background-size:cover;
background-position:center;
}

.hero-content h1{
font-size:85px;
font-family:'Cinzel', serif;
color:gold;
margin-bottom:20px;
}

.hero-content p{
max-width:750px;
margin:auto;
line-height:1.9;
font-size:20px;
color:#ddd;
}

.hero-buttons{
margin-top:40px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.btn{
padding:16px 38px;
border:none;
border-radius:40px;
cursor:pointer;
font-size:16px;
transition:0.4s;
font-weight:600;
}

.gold-btn{
background:gold;
color:black;
}

.gold-btn:hover{
transform:translateY(-5px);
box-shadow:0 0 25px gold;
}

.outline-btn{
background:transparent;
border:1px solid gold;
color:white;
}

.outline-btn:hover{
background:gold;
color:black;
}

/* SECTION */

section{
padding:120px 8%;
}

.section-title{
text-align:center;
font-size:50px;
font-family:'Cinzel', serif;
color:gold;
margin-bottom:70px;
}

/* PRODUCTS */

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:35px;
}

.card{
background:#0d0d0d;
border:1px solid rgba(255,215,0,0.2);
border-radius:25px;
overflow:hidden;
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px rgba(255,215,0,0.2);
}

.card img{
width:100%;
height:380px;
object-fit:cover;
}

.card-content{
padding:25px;
}

.card h3{
color:gold;
margin-bottom:10px;
font-size:25px;
}

.price{
margin-bottom:20px;
font-size:18px;
color:#ddd;
}

.shop-btn{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:gold;
color:black;
font-weight:600;
cursor:pointer;
}

/* ABOUT */

.about{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:60px;
align-items:center;
}

.about img{
width:100%;
border-radius:25px;
}

.about-text h2{
font-size:50px;
color:gold;
font-family:'Cinzel', serif;
margin-bottom:25px;
}

.about-text p{
line-height:2;
color:#ccc;
margin-bottom:30px;
}

/* CATEGORIES */

.category-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.category{
position:relative;
overflow:hidden;
border-radius:25px;
height:420px;
}

.category img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

.category:hover img{
transform:scale(1.1);
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(transparent, rgba(0,0,0,0.9));
display:flex;
align-items:flex-end;
padding:30px;
}

.overlay h3{
font-size:35px;
font-family:'Cinzel', serif;
}

/* TESTIMONIALS */

.testimonial-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.testimonial{
background:#0d0d0d;
padding:40px;
border-radius:25px;
border:1px solid rgba(255,215,0,0.2);
}

.testimonial p{
line-height:1.9;
color:#ccc;
margin-bottom:20px;
}

.testimonial h4{
color:gold;
}

/* NEWSLETTER */

.newsletter{
background:#0d0d0d;
padding:80px;
border-radius:30px;
text-align:center;
border:1px solid rgba(255,215,0,0.2);
}

.newsletter h2{
font-size:50px;
font-family:'Cinzel', serif;
color:gold;
margin-bottom:20px;
}

.newsletter p{
max-width:700px;
margin:auto;
line-height:1.9;
color:#ccc;
margin-bottom:35px;
}

.newsletter-box{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.newsletter-box input{
padding:18px;
width:320px;
border:none;
border-radius:40px;
font-size:16px;
}

footer{
padding:50px;
text-align:center;
color:gold;
margin-top:70px;
border-top:1px solid rgba(255,215,0,0.2);
}

/* MOBILE */

@media(max-width:768px){

.hero-content h1{
font-size:50px;
}

.hero-content p{
font-size:16px;
}

.nav-links{
display:none;
}

.section-title{
font-size:38px;
}

.newsletter{
padding:50px 25px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>

<div class="logo">
Pwani Pure
</div>

<div class="nav-links">

<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Skincare</a>
<a href="#">Fashion</a>
<a href="#">Contact</a>

<a href="#" class="cart">
🛒 Cart
</a>

</div>

</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>
Pure Beauty <br>
Pure Luxury
</h1>

<p>
Luxury skincare and timeless fashion inspired by elegance,
confidence, and coastal beauty.
</p>

<div class="hero-buttons">

<button class="btn gold-btn">
Shop Now
</button>

<button class="btn outline-btn">
View Collection
</button>

</div>

</div>

</section>

<!-- PRODUCTS -->

<section>

<h2 class="section-title">
Featured Collection
</h2>

<div class="product-grid">

<div class="card">

<img src="https://images.pexels.com/photos/3762879/pexels-photo-3762879.jpeg">

<div class="card-content">

<h3>Golden Glow Serum</h3>

<div class="price">
$45
</div>

<button class="shop-btn">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="https://images.pexels.com/photos/1926769/pexels-photo-1926769.jpeg">

<div class="card-content">

<h3>Luxury Silk Dress</h3>

<div class="price">
$120
</div>

<button class="shop-btn">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="https://images.pexels.com/photos/2113855/pexels-photo-2113855.jpeg">

<div class="card-content">

<h3>Pure Essence Cream</h3>

<div class="price">
$60
</div>

<button class="shop-btn">
Add To Cart
</button>

</div>

</div>

</div>

</section>

</body>

</html>
